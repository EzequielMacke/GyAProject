; El PHP por default del hosting suele traer upload_max_filesize/post_max_size
; muy por debajo de lo que la app permite (subirFoto valida hasta 50MB), así
; que una foto de celular (sobre todo iPhone: Live Photo, panorámica, ProRAW)
; se descarta silenciosamente ANTES de llegar a Laravel — eso hace que la
; validación diga "field is required" en vez de un error de tamaño, porque
; como Laravel ve, el archivo nunca llegó.
upload_max_filesize = 64M
post_max_size = 64M
